<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="2100" height="900">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001055"/>
      <stop offset="50%" stop-color="#002FA7"/>
      <stop offset="100%" stop-color="#0a1a6b"/>
    </linearGradient>
    <!-- 细线网格 pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
    </pattern>
    <!-- 点阵 pattern -->
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="rgba(255,255,255,0.18)"/>
    </pattern>
    <!-- 高亮渐变 -->
    <radialGradient id="glow" cx="65%" cy="40%" r="45%">
      <stop offset="0%" stop-color="rgba(91,123,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(0,47,167,0)"/>
    </radialGradient>
  </defs>

  <!-- 底色 -->
  <rect width="2100" height="900" fill="url(#bg)"/>
  <!-- 网格叠加 -->
  <rect width="2100" height="900" fill="url(#grid)"/>
  <!-- 右侧点阵区 -->
  <rect x="1400" y="0" width="700" height="900" fill="url(#dots)"/>
  <!-- 辉光 -->
  <rect width="2100" height="900" fill="url(#glow)"/>

  <!-- 左侧竖向年代刻度线 -->
  <line x1="110" y1="80" x2="110" y2="820" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- 年代节点 -->
  <g font-family="'JetBrains Mono','Courier New',monospace" fill="rgba(255,255,255,0.55)" font-size="20" letter-spacing="2">
    <circle cx="110" cy="160" r="5" fill="rgba(255,255,255,0.6)"/>
    <text x="130" y="166">前 301 年</text>
    <text x="130" y="190" font-size="16" fill="rgba(255,255,255,0.35)">海难 · 齐诺创立斯多葛</text>

    <circle cx="110" cy="310" r="5" fill="rgba(255,255,255,0.6)"/>
    <text x="130" y="316">约 55 年</text>
    <text x="130" y="340" font-size="16" fill="rgba(255,255,255,0.35)">爱比克泰德 · 《手册》</text>

    <circle cx="110" cy="460" r="5" fill="rgba(255,255,255,0.6)"/>
    <text x="130" y="466">121 年</text>
    <text x="130" y="490" font-size="16" fill="rgba(255,255,255,0.35)">马可·奥勒留 · 《沉思录》</text>

    <circle cx="110" cy="610" r="5" fill="rgba(255,255,255,0.6)"/>
    <text x="130" y="616">1956 年</text>
    <text x="130" y="640" font-size="16" fill="rgba(255,255,255,0.35)">CBT 认知行为疗法 · 斯多葛同根</text>

    <circle cx="110" cy="760" r="4" fill="#5B7BFF"/>
    <text x="130" y="766" fill="#7fa0ff">2026 年</text>
    <text x="130" y="790" font-size="16" fill="rgba(127,160,255,0.7)">Daily Stoic · 100 万订阅 · 全球复兴</text>
  </g>

  <!-- 中央大字 -->
  <g font-family="'Inter','Helvetica Neue','Helvetica',sans-serif">
    <!-- 主标题 -->
    <text x="560" y="280" font-size="148" font-weight="200" fill="rgba(255,255,255,0.94)" letter-spacing="-6">两千年</text>
    <text x="560" y="420" font-size="88" font-weight="200" fill="rgba(255,255,255,0.55)" letter-spacing="-2">前的答案</text>

    <!-- 副标 -->
    <text x="562" y="500" font-size="24" font-weight="300" fill="rgba(255,255,255,0.38)" letter-spacing="4" font-family="'JetBrains Mono','Courier New',monospace">ANCIENT WISDOM · MODERN URGENCY</text>

    <!-- 引言 -->
    <text x="562" y="620" font-size="30" font-weight="300" fill="rgba(255,255,255,0.72)" letter-spacing="-0.5" font-style="italic">"困扰人们的，不是事情本身，</text>
    <text x="562" y="662" font-size="30" font-weight="300" fill="rgba(255,255,255,0.72)" letter-spacing="-0.5" font-style="italic"> 而是他们对事情的看法。"</text>
    <text x="562" y="710" font-size="18" font-weight="500" fill="rgba(255,255,255,0.35)" letter-spacing="3" font-family="'JetBrains Mono','Courier New',monospace">— EPICTETUS · 约 55—135 AD</text>
  </g>

  <!-- 右侧几何装饰 -->
  <!-- 大圆环 -->
  <circle cx="1750" cy="450" r="280" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="1750" cy="450" r="200" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="1750" cy="450" r="120" fill="none" stroke="rgba(91,123,255,0.15)" stroke-width="1.5"/>
  <circle cx="1750" cy="450" r="44" fill="none" stroke="rgba(91,123,255,0.3)" stroke-width="1.5"/>
  <!-- 十字 -->
  <line x1="1750" y1="170" x2="1750" y2="730" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="1470" y1="450" x2="2030" y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- 右上角 accent 矩形 -->
  <rect x="1920" y="0" width="180" height="5" fill="#002FA7" opacity="0.9"/>
  <rect x="1920" y="12" width="120" height="2" fill="rgba(91,123,255,0.5)"/>

  <!-- 右下角数字 -->
  <text x="1940" y="860" font-size="110" font-weight="200" fill="rgba(255,255,255,0.06)" font-family="'Inter','Helvetica Neue',sans-serif" letter-spacing="-4">301</text>
  <text x="1945" y="880" font-size="14" font-weight="500" fill="rgba(255,255,255,0.2)" font-family="'JetBrains Mono','Courier New',monospace" letter-spacing="2">BC · ZENO · ATHENS</text>

  <!-- 底部水平线 + 元信息 -->
  <line x1="110" y1="840" x2="1380" y2="840" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="110" y="870" font-size="14" font-weight="500" fill="rgba(255,255,255,0.28)" font-family="'JetBrains Mono','Courier New',monospace" letter-spacing="2">STOICISM · FIELD NOTES · SS · 26.06.04</text>
</svg>
